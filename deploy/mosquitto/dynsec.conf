# Dev broker: per-Agent accounts + ACLs (US-17, dynamic-security plugin).
# Dhonomos manages Agent accounts (--usp-dynsec); no account -> no connect.
listener 1883
allow_anonymous false
persistence false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe

# Agents on the network -> TLS, else passwords cross it in clear text.
# Mount broker cert + key. deploy/docker-compose.yml publishes 1883 on loopback only
# -> publish 8883 when this listener is on.
# listener 8883
# cafile /mosquitto/certs/ca.pem
# certfile /mosquitto/certs/server.pem
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.2
