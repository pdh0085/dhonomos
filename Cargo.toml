[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "xtask"]
default-members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/pdh0085/dhonomos"

[workspace.dependencies]
# Internal crates
dhonomos-common = { path = "crates/common" }
dhonomos-datamodel = { path = "crates/datamodel" }
dhonomos-cwmp-codec = { path = "crates/cwmp-codec" }
dhonomos-cwmp-session = { path = "crates/cwmp-session" }
dhonomos-cwmp-server = { path = "crates/cwmp-server" }
dhonomos-usp-proto = { path = "crates/usp-proto" }
dhonomos-usp-mtp = { path = "crates/usp-mtp" }
dhonomos-usp-controller = { path = "crates/usp-controller" }
dhonomos-core = { path = "crates/core" }
dhonomos-rules = { path = "crates/rules" }
dhonomos-jobs = { path = "crates/jobs" }
dhonomos-store = { path = "crates/store" }
dhonomos-stats = { path = "crates/stats" }
dhonomos-api = { path = "crates/api" }
dhonomos-simulator = { path = "crates/simulator" }
dhonomos-pki = { path = "crates/pki" }
dhonomos-xmpp = { path = "crates/xmpp" }
dhonomos-wireguard = { path = "crates/wireguard" }

# External crates (versions are pinned as crates start using them)
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
# Base32 of TOTP secrets and recovery codes (ADR-100).
data-encoding = "2"
getrandom = "0.4"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1"] }
libc = "0.2"
md-5 = "0.11"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
thiserror = "2"
proptest = "1"
prost = "0.14"
prost-build = "0.14"
# QR code of the TOTP enrollment URI, drawn as SVG by the API (ADR-100).
qrcodegen = "1.8"
protox = "0.9"
quick-xml = "0.42"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
rune = "0.14"
rumqttc = { version = "0.25", default-features = false }
rust-embed = { version = "8", features = ["mime-guess"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
# Links, addresses, routes and rules of the WireGuard hub process (ADR-110).
rtnetlink = { version = "0.23", default-features = false, features = ["tokio_socket"] }
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
sha2 = "0.11"
socket2 = "0.6"
serde_json = "1"
serde-saphyr = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "macros", "migrate", "uuid", "time", "json"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["serde"] }
tempfile = "3"
x509-parser = "0.18"
# WireGuard key pairs (ADR-110); `static_secrets` is what lets a private key be built from bytes.
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Kernel WireGuard device configuration (generic netlink) for the hub process (ADR-110).
wireguard-uapi = { version = "3", default-features = false }
zeroize = "1"
# AES-256 encrypted zip for the Agent certificate bundle (ADR-099). Stored entries only: no
# compression codecs, no legacy ZipCrypto.
zip = { version = "9", default-features = false, features = ["aes-crypto"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto"] }
opentelemetry-http = { version = "0.33", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }
uuid = { version = "1", features = ["v7", "serde"] }
utoipa = { version = "5", features = ["uuid", "preserve_path_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
# Keep target/ small (the dev server has limited disk): enough debug info for backtraces,
# and no incremental cache (it grew to several GB).
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = false
