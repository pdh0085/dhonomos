# cargo-deny configuration. License policy: CONTRIBUTING.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # astral-tokio-tar unmaintained since 2026-11-03. Test only (via testcontainers), not in the
    # shipped binary. Drop this entry when testcontainers moves off it (TASKS.md backlog).
    { id = "RUSTSEC-2026-0440", reason = "test-only dependency of testcontainers; no fix yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
# Copyleft licenses (GPL, AGPL, LGPL, MPL, EUPL, EPL, SSPL, BUSL) are not allowed.
# Exceptions must be listed here per crate with a justification and an ADR reference.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
